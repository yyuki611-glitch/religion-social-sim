# 郡スペック（v2.0、設計: tasks/todo.md rev3。出典: docs/references.md「郡モデルのライト調査」）
#
# - 1村400人 = 江戸時代の平均的な村（40〜50戸・約400人）の史実に基づく
# - 16村 = 4×4格子の隣接グラフ（街道）。郡 ≈ 6,400人
# - 村に武士は不在（城下町集住）。百姓系（farmer+household+elder）≈ 90% は
#   身分別人口（農民80–85%）の史実に整合
# - 橋渡し（村間を行き来して隣接村を知覚する）= religious_specialist + merchant。
#   御師・講・旅僧・行商の史実に基づく
# - 信仰の確率は v0.5.0 の設計仮定を基礎に、ライト調査の順序情報（氏神=村落日常の中心 /
#   仏教内は浄土系優位・禅系次点 / 稲荷=商人）と矛盾しないことを確認して再宣言したもの。
#   ※具体値は歴史史料に基づかない設計上の仮定（スイープ S で初期分布ロバスト性を検証）
# - モデルの「信仰」は所属ではなく「主たる信心」（寺請制度下では全員が檀家+氏子のため）
villages: 16
village_size: 400
spread: 0.12
strength_range: [0.50, 0.80]
# 4×4 格子（row-major: V01..V04 / V05..V08 / V09..V12 / V13..V16）の上下左右
adjacency:
  V01: [V02, V05]
  V02: [V01, V03, V06]
  V03: [V02, V04, V07]
  V04: [V03, V08]
  V05: [V01, V06, V09]
  V06: [V02, V05, V07, V10]
  V07: [V03, V06, V08, V11]
  V08: [V04, V07, V12]
  V09: [V05, V10, V13]
  V10: [V06, V09, V11, V14]
  V11: [V07, V10, V12, V15]
  V12: [V08, V11, V16]
  V13: [V09, V14]
  V14: [V10, V13, V15]
  V15: [V11, V14, V16]
  V16: [V12, V15]
bridge_roles: [religious_specialist, merchant]
