[project]
name = "religion-social-sim"
version = "2.0.0"
description = "Japanese religion spread and decline social simulation"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7",
  "pandas>=2.0",
]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sim_core*"]
