<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>religion-social-sim viewer</title>
<style>
  :root {
    --bg: #1a1814; --panel: #25221c; --line: #3a352c;
    --text: #e8e2d4; --dim: #9a937f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 13px;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--dim); font-size: 12px; }
  #layout {
    display: grid; grid-template-columns: 1fr 320px;
    grid-template-rows: auto auto; gap: 10px; padding: 10px 16px;
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  #map-panel { grid-row: 1; grid-column: 1; }
  #side-panel { grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #chart-panel { grid-row: 2; grid-column: 1; }
  canvas { display: block; width: 100%; }
  #controls {
    display: flex; align-items: center; gap: 10px; padding: 8px 0 2px;
  }
  #controls button {
    background: #3d382e; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 14px; font-size: 13px; cursor: pointer;
  }
  #controls button:hover { background: #4a4438; }
  #step-slider { flex: 1; }
  #step-label { min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: normal; }
  #event-banner {
    min-height: 22px; padding: 4px 8px; border-radius: 6px;
    background: #33240f; color: #f0c674; font-size: 12px;
  }
  #event-banner.quiet { background: transparent; color: var(--dim); }
  #feed { overflow-y: auto; flex: 1; min-height: 120px; max-height: 300px; }
  .feed-item { padding: 4px 6px; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .feed-item .when { color: var(--dim); }
  .feed-item.future { opacity: 0.25; }
  .feed-item.now { background: #3a2f1a; }
  #agent-detail { font-size: 12px; line-height: 1.7; min-height: 110px; }
  #agent-detail .belief-chip {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px;
  }
  #legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; }
  #legend .item { display: flex; align-items: center; gap: 5px; }
  #legend .swatch { width: 11px; height: 11px; border-radius: 50%; }
  select { background: #3d382e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  @media (max-width: 800px) {
    #layout { grid-template-columns: 1fr; }
    #map-panel { grid-row: auto; grid-column: 1; }
    #side-panel { grid-row: auto; grid-column: 1; }
    #chart-panel { grid-row: auto; grid-column: 1; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">religion-social-sim</h1>
  <span class="meta" id="meta"></span>
</header>
<div id="layout">
  <div class="panel" id="map-panel">
    <canvas id="map" height="430"></canvas>
    <div id="controls">
      <button id="play">▶ 再生</button>
      <input type="range" id="step-slider" min="1" value="1">
      <span id="step-label"></span>
      <select id="speed">
        <option value="450">ゆっくり</option>
        <option value="220" selected>ふつう</option>
        <option value="90">はやい</option>
      </select>
    </div>
    <div id="event-banner" class="quiet">イベントなし</div>
  </div>
  <div id="side-panel">
    <div class="panel">
      <h2>信仰の色</h2>
      <div id="legend"></div>
    </div>
    <div class="panel">
      <h2>えらんだ村人（クリックで選択）</h2>
      <div id="agent-detail">村人をクリックすると詳細が出ます</div>
    </div>
    <div class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <h2>改宗・習合のできごと</h2>
      <div id="feed"></div>
    </div>
  </div>
  <div class="panel" id="chart-panel">
    <h2>信者数の推移</h2>
    <canvas id="chart" height="150"></canvas>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;

const BELIEF_COLORS = {
  classical_shinto: "#c08552", ujigami_shinto: "#7fbf6a", inari_belief: "#e85d5d",
  ryujin_belief: "#5d9fe8", jodo_buddhism: "#b07fe8", zen_buddhism: "#a8a8a8", mountain_belief: "#f0a93f",
};
const PLACE_ICONS = { settlement: "🏘", agriculture: "🌾", commerce: "🏮", shrine: "⛩", temple: "🛕", nature: "⛰" };

const beliefs = DATA.beliefs;            // {id: {label_ja}}
const agents = DATA.agents;              // {id: {label_ja, role}}
const places = DATA.places;              // [{id,label_ja,type,x,y,affinity}]
const turns = DATA.agent_turns;          // [{step,agent_id,belief,secondary_belief,strength,anxiety,openness}]
const shares = DATA.belief_shares;       // [{step,belief_id,adherents}]
const conversions = DATA.conversions;    // [{step,agent_id,kind,from_belief,to_belief}]
const eventsLog = DATA.events_log;       // [{step,event_id,type,label_ja}]
const maxStep = DATA.steps;

// ステップ → エージェント状態
const stateByStep = {};
for (const t of turns) {
  (stateByStep[t.step] ||= {})[t.agent_id] = t;
}

// 信仰 → 場所
const placeByAffinity = {};
for (const p of places) placeByAffinity[p.affinity] = p;

// --- レイアウト ---
const map = document.getElementById("map");
const mctx = map.getContext("2d");
function fitCanvas(c) {
  // サイズが変わったときだけ再設定する（毎フレーム再設定すると画面が点滅する）
  const w = Math.round(c.clientWidth * devicePixelRatio);
  const h = Math.round(c.getAttribute("height") * devicePixelRatio);
  if (c.width !== w || c.height !== h) {
    c.width = w;
    c.height = h;
  }
  c.getContext("2d").setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

const xs = places.map(p => p.x), ys = places.map(p => p.y);
const minX = Math.min(...xs) - 1.1, maxX = Math.max(...xs) + 1.1;
const minY = Math.min(...ys) - 1.0, maxY = Math.max(...ys) + 1.0;
// 狭い画面では場所の円・村人の散らばりを縮小する
function mapScale() { return Math.min(1, map.clientWidth / 700); }
function toScreen(x, y) {
  const w = map.clientWidth, h = 430;
  const pad = 50 + 40 * mapScale();
  return [ (x - minX) / (maxX - minX) * (w - pad * 2) + pad,
           h - ((y - minY) / (maxY - minY) * (h - 50) + 25) ];
}

// エージェントの描画位置：信仰に対応する場所の周りに役割ごとのオフセットで配置
const agentIds = Object.keys(agents);
const agentOffset = {};
agentIds.forEach((id, i) => {
  const angle = (i / agentIds.length) * Math.PI * 2;
  agentOffset[id] = [Math.cos(angle) * 34, Math.sin(angle) * 26];
});
// なめらかな移動用の現在座標
const agentPos = {};

let currentStep = 1;
let selectedAgent = null;
let playing = false;

function agentTarget(id, step) {
  const st = stateByStep[step][id];
  const place = placeByAffinity[st.belief] || places[0];
  const [px, py] = toScreen(place.x, place.y);
  const [ox, oy] = agentOffset[id];
  const s = mapScale();
  return [px + ox * s, py + oy * s];
}

// 村人の位置を1フレーム分進める。動きが残っていれば true を返す
function updatePositions() {
  let moving = false;
  for (const id of agentIds) {
    const target = agentTarget(id, currentStep);
    if (!agentPos[id]) agentPos[id] = [...target];
    const dx = target[0] - agentPos[id][0];
    const dy = target[1] - agentPos[id][1];
    if (Math.hypot(dx, dy) < 0.5) {
      agentPos[id] = [...target];  // 到着したら固定（微振動による描画ゆらぎを防ぐ）
    } else {
      agentPos[id][0] += dx * 0.18;
      agentPos[id][1] += dy * 0.18;
      moving = true;
    }
  }
  return moving;
}

function drawMap() {
  fitCanvas(map);
  const w = map.clientWidth;
  mctx.clearRect(0, 0, w, 430);

  // 場所
  const placeR = 30 + 16 * mapScale();
  for (const p of places) {
    const [x, y] = toScreen(p.x, p.y);
    mctx.strokeStyle = "#4a4438";
    mctx.setLineDash([4, 4]);
    mctx.beginPath(); mctx.arc(x, y, placeR, 0, Math.PI * 2); mctx.stroke();
    mctx.setLineDash([]);
    mctx.font = "20px sans-serif"; mctx.textAlign = "center";
    mctx.fillText(PLACE_ICONS[p.type] || "📍", x, y - placeR - 6);
    mctx.font = "11px sans-serif"; mctx.fillStyle = "#9a937f";
    mctx.fillText(p.label_ja, x, y - placeR - 24);
  }

  // 村人
  const st = stateByStep[currentStep];
  for (const id of agentIds) {
    const [x, y] = agentPos[id];
    const a = st[id];
    const r = 7 + a.strength * 9;

    // 習合（副次信仰）はリングで表現
    if (a.secondary_belief) {
      mctx.strokeStyle = BELIEF_COLORS[a.secondary_belief];
      mctx.lineWidth = 3;
      mctx.beginPath(); mctx.arc(x, y, r + 4, 0, Math.PI * 2); mctx.stroke();
    }
    mctx.fillStyle = BELIEF_COLORS[a.belief];
    mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI * 2); mctx.fill();
    if (id === selectedAgent) {
      mctx.strokeStyle = "#fff"; mctx.lineWidth = 2;
      mctx.beginPath(); mctx.arc(x, y, r + 8, 0, Math.PI * 2); mctx.stroke();
    }
    mctx.fillStyle = "#e8e2d4"; mctx.font = "10px sans-serif";
    mctx.fillText(agents[id].label_ja, x, y + r + 12);
  }
}

map.addEventListener("click", (e) => {
  const rect = map.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = null, bestD = 22;
  for (const id of agentIds) {
    const [x, y] = agentPos[id] || agentTarget(id, currentStep);
    const d = Math.hypot(x - mx, y - my);
    if (d < bestD) { best = id; bestD = d; }
  }
  selectedAgent = best;
  renderDetail();
  needsRedraw = true;
});

function renderDetail() {
  const el = document.getElementById("agent-detail");
  if (!selectedAgent) { el.textContent = "村人をクリックすると詳細が出ます"; return; }
  const a = stateByStep[currentStep][selectedAgent];
  const chip = (b) => `<span class="belief-chip" style="background:${BELIEF_COLORS[b]}"></span>${beliefs[b].label_ja}`;
  el.innerHTML = `
    <b>${agents[selectedAgent].label_ja}</b>（${selectedAgent}）<br>
    信仰：${chip(a.belief)}（強さ ${a.strength}）<br>
    ${a.secondary_belief ? `副次信仰：${chip(a.secondary_belief)}<br>` : ""}
    不安：${a.anxiety} ／ 改宗への開き：${a.openness}<br>
    いま惹かれている先：${chip(a.top_pull)}（差 ${a.gap}）`;
}

// --- イベントバナー ---
function renderEvents() {
  const banner = document.getElementById("event-banner");
  const recent = eventsLog.filter(e => e.step <= currentStep && currentStep - e.step < 8);
  if (recent.length) {
    banner.className = "";
    banner.textContent = recent.map(e => `⚡ step ${e.step}: ${e.label_ja}`).join("　");
  } else {
    banner.className = "quiet";
    banner.textContent = "イベントなし";
  }
}

// --- 改宗フィード ---
// DOM は最初に1回だけ作り、ステップ変更時は class の付け替えのみ行う
// （毎回 innerHTML を作り直すと再生中にちらつく）
const feedEl = document.getElementById("feed");
feedEl.innerHTML = conversions.map(c => {
  const kind = c.kind === "syncretism" ? "を取り込んだ（習合）" : "へ改宗";
  return `<div class="feed-item"><span class="when">step ${c.step}</span> ` +
    `${agents[c.agent_id].label_ja}：${beliefs[c.from_belief].label_ja} → ${beliefs[c.to_belief].label_ja}${kind}</div>`;
}).join("") || '<div class="feed-item">このシナリオでは改宗は起きませんでした</div>';
const feedItems = Array.from(feedEl.querySelectorAll(".feed-item"));

function renderFeed() {
  feedItems.forEach((el, i) => {
    const c = conversions[i];
    if (!c) return;
    el.className = "feed-item " +
      (c.step > currentStep ? "future" : (c.step === currentStep ? "now" : ""));
  });
}

// --- 折れ線グラフ ---
const chart = document.getElementById("chart");
function drawChart() {
  fitCanvas(chart);
  const ctx = chart.getContext("2d");
  const w = chart.clientWidth, h = 150;
  ctx.clearRect(0, 0, w, h);
  const series = {};
  for (const s of shares) (series[s.belief_id] ||= [])[s.step - 1] = s.adherents;
  const maxA = Object.keys(agents).length;
  const px = (step) => 30 + (step - 1) / (maxStep - 1) * (w - 45);
  const py = (v) => h - 18 - v / maxA * (h - 30);
  ctx.strokeStyle = "#3a352c";
  ctx.beginPath(); ctx.moveTo(30, py(0)); ctx.lineTo(w - 15, py(0)); ctx.stroke();
  for (const [b, vals] of Object.entries(series)) {
    if (Math.max(...vals) === 0) continue;
    ctx.strokeStyle = BELIEF_COLORS[b]; ctx.lineWidth = 2;
    ctx.beginPath();
    vals.forEach((v, i) => i === 0 ? ctx.moveTo(px(i + 1), py(v)) : ctx.lineTo(px(i + 1), py(v)));
    ctx.stroke();
  }
  // 現在位置
  ctx.strokeStyle = "#f0c674"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px(currentStep), 5); ctx.lineTo(px(currentStep), h - 15); ctx.stroke();
  ctx.fillStyle = "#9a937f"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
  for (const s of [1, Math.round(maxStep / 2), maxStep]) ctx.fillText(s, px(s), h - 4);
}

// --- 凡例 ---
document.getElementById("legend").innerHTML = Object.entries(beliefs)
  .map(([id, b]) => `<span class="item"><span class="swatch" style="background:${BELIEF_COLORS[id]}"></span>${b.label_ja}</span>`)
  .join("");

// --- 再生制御 ---
const slider = document.getElementById("step-slider");
slider.max = maxStep;
const playBtn = document.getElementById("play");
let timer = null;

function setStep(s) {
  currentStep = Math.max(1, Math.min(maxStep, s));
  slider.value = currentStep;
  document.getElementById("step-label").textContent = `step ${currentStep} / ${maxStep}`;
  renderEvents(); renderFeed(); renderDetail(); drawChart();
  needsRedraw = true;
}
slider.addEventListener("input", () => setStep(parseInt(slider.value)));

function play() {
  playing = true; playBtn.textContent = "⏸ 停止";
  const tick = () => {
    if (!playing) return;
    if (currentStep >= maxStep) { pause(); return; }
    setStep(currentStep + 1);
    timer = setTimeout(tick, parseInt(document.getElementById("speed").value));
  };
  if (currentStep >= maxStep) setStep(1);
  tick();
}
function pause() { playing = false; playBtn.textContent = "▶ 再生"; clearTimeout(timer); }
playBtn.addEventListener("click", () => playing ? pause() : play());

// 描画ループ：動きがあるとき・変更があったときだけ再描画する
// （毎フレーム無条件に消して描き直すと、端末によっては点滅して見える）
let needsRedraw = true;
function loop() {
  const moving = updatePositions();
  if (moving || needsRedraw) {
    drawMap();
    needsRedraw = false;
  }
  requestAnimationFrame(loop);
}

document.getElementById("title").textContent = `${DATA.title} — ${DATA.scenario_label}`;
document.getElementById("meta").textContent =
  `scenario=${DATA.scenario} / seed=${DATA.seed} / 村人${Object.keys(agents).length}人 / 改宗${DATA.n_conversions}件 / 定着率${DATA.retention_rate}`;
window.addEventListener("resize", () => { drawChart(); needsRedraw = true; });
const initStep = parseInt(new URLSearchParams(location.search).get("step")) || 1;
setStep(initStep);
// 初期ステップ指定時は補間なしでその位置に配置
for (const id of agentIds) agentPos[id] = agentTarget(id, currentStep);
loop();
</script>
</body>
</html>
